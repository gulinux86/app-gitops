# The workload under test: what a node roll must not take down.
#
# Every field below is one of the things a voluntary disruption — an EKS node-group
# roll, a Karpenter drift or consolidation, a Spot reclaim — depends on. Remove one
# and the upgrade still succeeds; the requests in flight are what fail.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim
  namespace: app-sim
spec:
  # Three, with the PDB allowing one out: a drain always has two serving.
  replicas: 3
  # A new pod has to stay Ready this long before it counts — a pod that passes its
  # first probe and then crashes does not let a rollout or a drain move on.
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: sim
  template:
    metadata:
      labels:
        app: sim
    spec:
      # Karpenter nodes only. The system node group would hold these pods easily,
      # and then Karpenter would never provision anything — the drift, consolidation
      # and Spot paths would go untested.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: karpenter.sh/nodepool
                    operator: Exists

      # Never all replicas on one node: draining that node would take every one at
      # once, PDB or not — the PDB only paces evictions, it cannot create capacity.
      # Hard on hostname; soft on zone, so a zone short of Spot does not block.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: sim
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: sim

      # Long enough for preStop plus podinfo's own drain (it marks itself unready on
      # SIGTERM and waits 3s before closing listeners).
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        # The image's user is named ("app"), and runAsNonRoot cannot verify a name;
        # 100:101 is that user in the image's /etc/passwd.
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: podinfo
          # Tag for the reader, digest for the cluster: a tag can be moved.
          image: ghcr.io/stefanprodan/podinfo:6.15.0@sha256:ec73780a8425f59ea49f5bc8cdff0d598805a224fbaa1f86c67a244f250fa9da
          command:
            - ./podinfo
            - --port=9898
            - --level=info
          ports:
            - name: http
              containerPort: 9898

          # Readiness is what takes a terminating pod out of the Service; a fast
          # period shortens the window in which it still receives requests.
          #
          # initialDelaySeconds holds a new pod out of the Service for its first
          # 25s. On a node Karpenter just launched, the pod is otherwise Ready
          # before that node's ztunnel and istio-cni are, and the requests sent to
          # it in between fail with 503 — measured on hml: ztunnel came up 8-17s
          # after the app on each replacement node, and all six failures of a
          # disruption test fell in that gap. 25s covers the slowest with margin.
          #
          # A delay is a stand-in for the real signal, and it slows every rollout
          # by the same 25s. The platform-level fix is a NodePool startup taint
          # removed once the node's data plane is Ready; it needs a component with
          # cluster-wide `nodes/patch`, and was deferred for that reason.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 25
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10

          # SIGTERM and the endpoint removal race: kubelet signals the container
          # while the Service, the gateway and ztunnel are still learning the pod is
          # going. Waiting first lets them catch up, so no new request arrives at a
          # process that is closing. The native sleep action needs no shell in the
          # image.
          lifecycle:
            preStop:
              sleep:
                seconds: 10

          # requests == limits for memory: Karpenter packs by requests, and a pod
          # that grows past its request can land on a node that cannot hold it
          # (platform-gitops, "Capacity").
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 64Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        # podinfo's --data-path; the root filesystem is read-only.
        - name: data
          emptyDir: {}
