# Attaches to the shared platform gateway. The gateway accepts routes only from
# namespaces labelled gateway-access=true — a label the platform repository sets on
# app-sim, not something this repository can grant itself.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sim
  namespace: app-sim
spec:
  parentRefs:
    - name: platform-gateway
      namespace: istio-ingress
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /sim
      # podinfo serves from /; the prefix only selects the route.
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: sim
          port: 80
