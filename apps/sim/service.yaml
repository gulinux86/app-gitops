apiVersion: v1
kind: Service
metadata:
  name: sim
  namespace: app-sim
spec:
  # ClusterIP: traffic enters through the platform gateway, never through a load
  # balancer created from this repository (platform-gitops, rule 2).
  type: ClusterIP
  selector:
    app: sim
  ports:
    - name: http
      port: 80
      targetPort: http
