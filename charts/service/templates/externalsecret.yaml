{{- if .Values.secrets }}
# The values listed under `secrets:`, read from AWS Secrets Manager into one Secret
# that the container takes with envFrom.
#
# Through the ClusterSecretStore `aws` (platform-gitops), which serves namespaces whose
# tenant has `secrets: true`. The cluster admits an ExternalSecret in app-<name> only
# for keys under apps/<name>/ (platform-gitops, components/policies/
# tenant-secrets.yaml); the chart refuses any other key before it gets that far.
#
# creationPolicy Owner: the Secret belongs to this ExternalSecret and is deleted with
# it — removing `secrets:` from the values removes the Secret from the cluster, never
# the value from Secrets Manager.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "service.name" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secretsRefreshInterval }}
  secretStoreRef:
    name: aws
    kind: ClusterSecretStore
  target:
    name: {{ include "service.name" . }}-secrets
    creationPolicy: Owner
  data:
    {{- range .Values.secrets }}
    - secretKey: {{ .env }}
      remoteRef:
        key: {{ .key }}
        {{- with .property }}
        property: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
